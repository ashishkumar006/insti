services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: campus
      POSTGRES_DB: campusguide
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  api:
    build: {context: .., dockerfile: infra/Dockerfile}
    ports: ["8200:8200"]
    environment:
      DATABASE_URL: postgresql://campus:campus@postgres:5432/campusguide
      LLM_MODE: gateway
      GATEWAY_URL: http://host.docker.internal:8109
    depends_on: [postgres]
volumes: {pgdata: {}}
