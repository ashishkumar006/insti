services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: campus
      POSTGRES_DB: campusguide
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus -d campusguide"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: {context: .., dockerfile: infra/Dockerfile}
    ports: ["8200:8200"]
    environment:
      DATABASE_URL: postgresql://campus:campus@postgres:5432/campusguide
      # Direct mode: everything in app/, no gateway (retired to archive/).
      LLM_MODE: direct
      EMBED_MODE: gemini
      OCR_MODE: gemini
      PAYGO_CHAT_MODEL: gemini-2.0-flash
      PAYGO_EMBED_MODEL: gemini-embedding-001
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      # EMBED_DIM must match the chunks.embedding vector() width in
      # migrations/001_init.sql. Changing it needs an ALTER TABLE.
      EMBED_DIM: "768"
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    depends_on:
      postgres: {condition: service_healthy}
volumes: {pgdata: {}}